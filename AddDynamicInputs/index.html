
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فرم افزودن سوابق</title>

    <link rel="stylesheet" href="./Assets/css/main.css">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/d9f743286c.js"
            crossorigin="anonymous"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 600px;
            max-width: 90%;
            min-height: 200px;
            background-color: #fff;

            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            padding: 20px;
            border-radius: 8px;

            box-shadow: 1px 1px 10px rgba(128, 124, 124, 0.5);
        }

        .container h6 {
            text-align: center;
            font-size: 16px;
            font-weight: normal;

            margin: 0 0 20px;
            padding-bottom: 12px;

            border-bottom: 1px solid #efefef;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .container form label {
            font-size: 14px;
        }

        .container form input {
            width: 100%;
            height: 40px;

            border: 1px solid #ddd;
            border-radius: 5px;

            padding: 0 12px;
            font-family: inherit;
            font-size: 14px;

            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .container form input:focus {
            outline: none;
            border-color: rgb(70, 156, 253);
            box-shadow: 0 0 0 2px rgba(70, 156, 253, 0.15);
        }

        .container form a {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 20px;

            color: #000;
            text-decoration: none;
            font-size: 14px;
        }

        .container form a i {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 25px;
            height: 25px;

            color: #fff;
            background-color: rgb(56, 12, 121);
            border-radius: 50%;

            font-size: 12px;
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <form action="">

        <h6>فرم افزودن سوابق</h6>

        <div class="input-group">

            <label for="input">سابقه</label>

            <input
                type="text"
                id="input"
                placeholder="سابقه خود را وارد نمایید"  >

        </div>

        <a href="" id="addelement"> <i class="fa-solid fa-plus"></i>  افزودن سابقه جدید   </a>

           

    </form>
</div>


    
    
    
    
    <script src="./Assets/js/project-1.js"></script>

</body>
</html>
