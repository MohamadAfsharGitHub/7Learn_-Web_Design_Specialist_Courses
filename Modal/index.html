
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modal</title>

    <link rel="stylesheet" type="text/css" href="./Assets/css/main.css">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=chevron_line_up" />

    <style>
      body{
          background-image: url(../modal/Assets/img/Pattern-PNG-Image-HD.png);
        }
        .modal {
            display: none;
            width: 400px;
            height: 300px;
            text-align: center;
            background-color: #fff;
            box-shadow: 1px 1px 10px 1px rgba(128, 124, 124, .5);
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .bg-modal {
            display: none;
            background-color: rgba(0, 0, 0, .5);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99;
            width: 100%;
            height: 100vh;
        }

        .modal-link {
            width: 100px;
            height: 50px;
            background-color: #efefef;
            padding: 10px;
            font-size: 16px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 1px 1px 10px 1px rgba(128, 128, 128, .124);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #000;
        }
        
    </style>
</head>


<body>

   
    <a href="#" class="modal-link">کلیک کنید</a>

    <div class="modal">
        <p>محتوا</p>
        <a href="#" class="close">بستن مدال</a>
    </div>

    <div class="bg-modal"></div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
            crossorigin="anonymous"></script>

    <script src="./Assets/js/project-1.js"></script>

</body>
</html>
