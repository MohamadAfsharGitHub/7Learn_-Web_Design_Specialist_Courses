<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پروژه شماره- 1</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="stylesheet" href="./Assets/css/main.css" />

    <style>
      .course-title {
        display: flex;
        justify-content: center;
        font-weight: bold;
        font-size: 34px;
        color: #fff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #696969;
        min-height: 100%;
        overflow: hidden;
      }
      .container {
        max-width: 450px;
        background-color: #fff;
        box-shadow: 0 0 9px 0px rgba(0, 0, 03);
        margin: 100px auto;
        padding: 15px;
        border-radius: 5px;
      }
      .input-group {
        position: relative;
      }
      .input-group input {
        width: 100%;
        height: 40px;
        border: 1px solid #efefef;
        outline: 0;
        padding: 0 10px;
        margin-bottom: 15px;
      }
      .input-group .btn {
        background-color: rgb(27, 226, 27);
        color: #fff;
        font-size: 10px;
        padding: 5px 10px;
        margin-top: 20px;
        cursor: pointer;
      }
      .input-group .btn:hover {
        background-color: rgb(21, 197, 21);
        transition: background-color 0.5s ease-out;
      }
      .input-group i#show-pass {
        position: absolute;
        font-size: 18px;
        top: 12px;
        left: 9px;
        color: #807d7d;
        cursor: pointer;
        transition: all 0.5s linear;
      }
      .input-group i#show-pass:hover {
        color: #3987fc;
        font-size: 19px;
      }
    </style>
  </head>

  <body>
    <p class="course-title">پروژه شماره4</p>
    <div class="container">
      <form action="">
        <div class="input-group">
          <input type="text" placeholder="نام کاربری..." />
        </div>
        <div class="input-group">
          <i id="show-pass" class="far fa-eye-slash"></i>
          <!--<i class="far fa-eye-slash"></i>-->
          <input
            class="pass"
            value="erfan"
            type="password"
            placeholder="کلمه عبور...."
          />
        </div>
        <div class="input-group">
          <input class="btn" type="submit" value="ورود" />
        </div>
      </form>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#show-pass").click(function () {
          if ($(".pass").attr("type") === "password") {
            $(".pass").attr("type", "text");
            $("#show-pass").removeClass("fa-eye-slash").addClass("fa-eye");
          } else {
            $(".pass").attr("type", "password");
            $("#show-pass").removeClass("fa-eye").addClass("fa-eye-slash");
          }
        });
      });
    </script>
  </body>
</html>
